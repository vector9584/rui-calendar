# =============================================================================
# 瑞历自托管日历系统 — ECS nginx 站点配置示例（7086 独立 HTTPS 端口）
# =============================================================================
# 脱敏说明：以下域名 / 证书路径 / frps 地址均为占位符，clone 后替换成你的真实值。
#   - your-domain.example.com  →  你的公网域名
#   - /path/to/cert/*.pem     →  你的 TLS 证书路径
#   - 127.0.0.1:7031/7032/7033 →  frps 在 ECS 本机监听的隧道端口（见 frpc example）
#
# 端口策略：本系统走独立 7086 ssl 端口，绝不挂在 80/443 主站（会覆盖主站）。
# 改配置前先 cp 备份，改完 `nginx -t && nginx -s reload`。
# =============================================================================

server {
    listen 7086 ssl;
    server_name your-domain.example.com;

    ssl_certificate     /path/to/cert/fullchain.pem;
    ssl_certificate_key /path/to/cert/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---- CalDAV / CardDAV 自动发现（iOS 原生 App 依赖）----
    location = /.well-known/caldav  { return 301 /dav.php/; }
    location = /.well-known/carddav { return 301 /dav.php/; }

    # acme-challenge 本地保留（勿反代，否则证书续期失败）
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }

    # ---- Calino 网页前端 → frpc 7032 → NAS Calino 容器 5233 ----
    location / {
        proxy_pass http://127.0.0.1:7032/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Baikal CalDAV/CardDAV → frpc 7031 → NAS Baikal 5232 ----
    # 浏览器端 Calino 直连需要 CORS 头；iOS 需要 OPTIONS 探测返回 DAV/Allow 能力头。
    location /dav.php/ {
        proxy_pass http://127.0.0.1:7031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 预检：必须同时补 DAV + Allow 能力头，否则 iOS 认证后放弃同步
        # 并误报「无法使用 SSL」（真实原因是拿不到 calendar-access 能力）。
        if ($request_method = OPTIONS) {
            add_header 'DAV' '1, 3, extended-mkcol, access-control, calendarserver-principal-property-search, calendar-access, calendar-proxy, calendar-auto-schedule, calendar-availability, resource-sharing, calendarserver-sharing, addressbook' always;
            add_header 'Allow' 'OPTIONS, GET, HEAD, DELETE, PROPFIND, PUT, PROPPATCH, COPY, MOVE, REPORT' always;
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, DELETE, PROPFIND, PUT, PROPPATCH, COPY, MOVE, REPORT, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Depth, Prefer, If-Match, If-None-Match' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }

        # 实际响应（Basic auth 走 Authorization 头，不能用 *，用 $http_origin 反射）
        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'ETag, DAV, WWW-Authenticate' always;
    }

    # ---- Baikal 管理后台 → frpc 7031 ----
    # ⚠️ Host 必须用 $http_host（带端口），否则 Baikal 生成的 <base href> 丢端口，
    #    后台 CSS/JS 全去 443 主站加载返回 404 → 页面白屏。
    location /admin/ {
        proxy_pass http://127.0.0.1:7031;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /res/ {
        proxy_pass http://127.0.0.1:7031;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- 通用 CORS 代理 → frpc 7033 → NAS calino-proxy 5234 ----
    # 供浏览器订阅外部 ICS 源使用。URL 约定 /proxy/<base64url编码的目标origin>/<路径>。
    # 尾斜杠剥 /proxy/ 前缀。⚠️ 不要用 set/map 剥前缀（会把 % 转义成 %25 双重编码）。
    location /proxy/ {
        proxy_pass http://127.0.0.1:7033/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60;
    }
}
