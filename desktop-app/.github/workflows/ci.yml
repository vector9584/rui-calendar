name: verify

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            整体架构必须先读/ruili-calendar/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: 整体架构必须先读/ruili-calendar
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run e2e
      - run: npm run build
      - run: npm run build:win
        if: runner.os == 'Windows'
      - run: npm run build:mac
        if: runner.os == 'macOS'
      - run: npm run build:linux
        if: runner.os == 'Linux'

