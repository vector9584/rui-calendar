name: Android Release

# Same tag trigger as docker.yml's publish job — scripts/release.sh pushes
# the vX.Y.Z tag and creates the GitHub Release in one motion, so by the
# time this job reaches the upload step the release already exists and
# softprops/action-gh-release just attaches the APK to it.
#
# workflow_dispatch exists for the case where the release already went out
# before this workflow was ever in the repo (tags pushed from a repo without
# it never built anything). Pass the existing tag to backfill its APK.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the APK to (e.g. v1.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        # version auto-read from packageManager field

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build web app
        run: pnpm build

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode release keystore
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystore/calino-release.jks

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=keystore/calino-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK with version tag
        run: cp android/app/build/outputs/apk/release/app-release.apk "ruili-${TAG}.apk"

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: ruili-*.apk
